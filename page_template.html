<title>OverEdge Auto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: una columna de tarjetas de apuesta arriba, lista compacta de partidos descartados debajo. */
:root{
  --bg:#f3f5f3; --surface:#ffffff; --surface2:#e9eeeb; --line:#d5ddd9;
  --fg:#16211d; --muted:#5b6a64;
  --accent:#0c6a58; --accent-fg:#ffffff; --accent-soft:#d8ece6;
  --warn:#8a5a00; --warn-soft:#f6e8c6; --bad:#a3322b;
  --f-body:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-num:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1714; --surface:#17221e; --surface2:#1f2d28; --line:#2b3b35;
  --fg:#e5eee9; --muted:#97a9a1;
  --accent:#4fc4a8; --accent-fg:#06231c; --accent-soft:#17352d;
  --warn:#e3b24e; --warn-soft:#352b12; --bad:#ef8b83; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1714; --surface:#17221e; --surface2:#1f2d28; --line:#2b3b35;
  --fg:#e5eee9; --muted:#97a9a1;
  --accent:#4fc4a8; --accent-fg:#06231c; --accent-soft:#17352d;
  --warn:#e3b24e; --warn-soft:#352b12; --bad:#ef8b83; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:760px;margin-inline:auto;display:flex;flex-direction:column;gap:20px}
h1{font-size:22px;margin:0;letter-spacing:-.01em}
h2{font-size:13px;margin:0;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
header{display:flex;flex-direction:column;gap:6px}
.meta{color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:4px 14px}
.aviso{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:13px}
.sec{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.hecha{opacity:.55}
.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.who{min-width:0}
.who b{font-size:18px;display:block;overflow-wrap:anywhere}
.who span{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.stake{background:var(--accent);color:var(--accent-fg);border-radius:8px;padding:6px 12px;text-align:center;flex:none}
.stake b{font-size:22px;display:block;line-height:1.1}
.stake small{font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px 14px}
.kv{display:flex;flex-direction:column;min-width:0}
.kv small{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.kv span{font-size:15px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--surface2);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--fg)}
.chip.inv{background:var(--warn-soft);color:var(--warn)}
.chip.dir{background:var(--accent-soft);color:var(--accent)}
.nota{font-size:13px;color:var(--muted)}
label.ap{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);cursor:pointer}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.vacio{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:18px;color:var(--muted)}
details{background:var(--surface);border:1px solid var(--line);border-radius:10px}
summary{padding:12px 14px;cursor:pointer;font-weight:600;font-size:14px}
summary:focus-visible,input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabla{overflow-x:auto;border-top:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:520px}
th,td{text-align:left;padding:7px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
tr:last-child td{border-bottom:0}
.dim{color:var(--muted)}
.tog{align-self:flex-start;background:var(--surface2);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
@media (prefers-reduced-motion:no-preference){.card{transition:opacity .2s}}
</style>

<div class="wrap">
  <header>
    <h1>OverEdge Auto</h1>
    <div class="meta"><span id="gen"></span><span id="cnt"></span></div>
  </header>
  <div class="aviso">Las cuotas llegan de Flashscore (Bet365) y pueden ir unos minutos por detrás. Antes de apostar, mira la cuota real en Bet365: si es menor que la “cuota mínima”, no entres.</div>
  <section class="sec" id="apuestas"><h2>Apuestas</h2></section>
  <section class="sec"><h2>Resto de partidos</h2><div id="resto"></div></section>
  <button class="tog" id="tema" type="button">Cambiar tema</button>
</div>

<script>
const DATA = /*__DATA__*/null;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const f2 = (x) => (x == null ? '–' : Number(x).toFixed(2));
const pct = (x) => (x == null ? '–' : (x * 100).toFixed(1) + ' %');
const SUP = { D: 'Dura', T: 'Tierra', H: 'Hierba' };
let hechas = {};
try { hechas = JSON.parse(localStorage.getItem('oe_hechas') || '{}'); } catch (e) {}
function guardar() { try { localStorage.setItem('oe_hechas', JSON.stringify(hechas)); } catch (e) {} }

function tarjeta(p) {
  const a = p.apuesta, inv = a.tipo === 'invertida';
  const sup = (SUP[p.superficie] || '') + (p.interior ? ' cubierta' : '');
  const min = a.cuotaMin4 != null ? `<div class="kv"><small>Cuota mínima</small><span class="num">${f2(a.cuotaMin4)}</span></div>` : '';
  const nota = inv
    ? `<div class="nota">Inversión: el Motor da ${a.euros} € a la favorita (${esc(p.fav)} a ${f2(a.cuotaFavOriginal)}, edge ${pct(a.edgeFavOriginal)}). Se apuesta a la rival con los mismos euros. No hay mínimo de cuota.</div>`
    : `<div class="nota">El Motor da ${a.euros} € a la no favorita. Con una cuota por debajo de ${f2(a.cuotaMin4)} el stake bajaría de 4 €.</div>`;
  return `<div class="card${hechas[p.id] ? ' hecha' : ''}" data-id="${esc(p.id)}">
    <div class="top"><div class="who"><b>${esc(a.jugadora)}</b><span>contra ${esc(a.rival)}</span></div>
    <div class="stake"><b class="num">${a.euros} €</b><small>${inv ? 'invertida' : 'directa'}</small></div></div>
    <div class="grid">
      <div class="kv"><small>Cuota Bet365</small><span class="num">${f2(a.cuota)}</span></div>
      ${min}
      <div class="kv"><small>Cuota justa</small><span class="num">${f2(a.cuotaJusta)}</span></div>
      <div class="kv"><small>Edge sobre ${inv ? 'NF' : 'cuota'}</small><span class="num">${pct(a.edge)}</span></div>
    </div>
    <div class="chips"><span class="chip ${inv ? 'inv' : 'dir'}">${inv ? 'Invertida' : 'Directa'}</span><span class="chip">${esc(p.torneo)} · ${esc(p.nivel)}</span><span class="chip">${esc(sup)}</span><span class="chip num">${esc(p.fecha.slice(5).split('-').reverse().join('/'))} ${esc(p.hora)}</span></div>
    ${nota}
    <label class="ap"><input type="checkbox" data-ap="${esc(p.id)}" ${hechas[p.id] ? 'checked' : ''}> Ya la he apostado</label>
  </div>`;
}

function render() {
  const ps = DATA.partidos || [];
  const ap = ps.filter((p) => p.estadoApp === 'APUESTA');
  const resto = ps.filter((p) => p.estadoApp !== 'APUESTA');
  $('gen').textContent = 'Actualizado ' + DATA.generadoMadrid;
  $('cnt').textContent = ap.length + ' apuestas de ' + ps.length + ' partidos por jugar';
  const box = $('apuestas');
  box.innerHTML = '<h2>Apuestas</h2>' + (ap.length ? ap.map(tarjeta).join('') :
    '<div class="vacio">Ahora mismo ningún partido cumple la regla: no favorita con 4 o 5 € del Motor, o favorita con 4 o 5 € para invertir. Esta página se actualiza sola.</div>');
  box.querySelectorAll('input[data-ap]').forEach((el) => el.addEventListener('change', () => {
    hechas[el.dataset.ap] = el.checked; guardar(); el.closest('.card').classList.toggle('hecha', el.checked);
  }));
  const filas = resto.map((p) => {
    const jug = p.fav ? `${esc(p.fav)} <span class="dim">(${f2(p.bFav)})</span> – ${esc(p.nf)} <span class="dim">(${f2(p.bNf)})</span>` : esc((p.jugadoras || []).join(' – '));
    const pf = p.pFav != null ? `<span class="num">${pct(p.pFav)}</span>` : '<span class="dim">–</span>';
    return `<tr><td class="num">${esc(p.hora)}</td><td>${jug}<br><span class="dim">${esc(p.torneo)}</span></td><td>${pf}</td><td>${esc(p.motivo || '')}</td></tr>`;
  }).join('');
  $('resto').innerHTML = `<details><summary>${resto.length} partidos sin apuesta</summary><div class="tabla"><table><thead><tr><th>Hora</th><th>Partido (cuota)</th><th>p fav.</th><th>Motivo</th></tr></thead><tbody>${filas}</tbody></table></div></details>`;
}
render();
$('tema').addEventListener('click', () => {
  const r = document.documentElement;
  const osOscuro = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
  const actual = r.getAttribute('data-theme') || (osOscuro ? 'dark' : 'light');
  r.setAttribute('data-theme', actual === 'dark' ? 'light' : 'dark');
});
</script>
